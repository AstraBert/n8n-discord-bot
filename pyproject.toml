[project]
name = "n8n-discord-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { email = "astraberte9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
]

[project.scripts]
n8n-discord-bot = "n8n_discord_bot:main"
n8n-qdrant-collection = "n8n_discord_bot:collection_main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "qdrant-client>=1.19.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
